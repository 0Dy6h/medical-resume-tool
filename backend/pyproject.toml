[project]
name = "medical-resume-intelligence-backend"
version = "0.1.0"
description = "Local MVP backend for Chinese medical job intelligence and truthful resume tailoring."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pytest>=8.3.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
]

