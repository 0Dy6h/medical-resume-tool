[project]
name = "medical-resume-intelligence-backend"
version = "0.1.0"
description = "Local MVP backend for Chinese medical job intelligence and truthful resume tailoring."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "fpdf2>=2.8.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.5",
  "pillow>=10.0.0",
  "pydantic>=2.8.0",
  "pymupdf>=1.24.0",
  "pytesseract>=0.3.13",
  "pytest>=8.3.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "playwright>=1.60.0",
]
